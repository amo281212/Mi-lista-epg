name: Actualizar EPG Automáticamente

on:
  schedule:
    # Se ejecutará automáticamente todos los días a las 06:00 UTC (02:00 / 03:00 am hora de Chile)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente cuando tú quieras probar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Ejecutar script de EPG
      run: python actualizar_epg.py

    - name: Guardar y publicar el archivo actualizado
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add epg_final.xml
        git commit -m "EPG actualizada automáticamente" || exit 0
        git push
