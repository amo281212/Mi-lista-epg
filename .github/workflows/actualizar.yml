name: Actualizar EPG Automatizado

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# Evita que dos ejecuciones intenten modificar main al mismo tiempo.
concurrency:
  group: actualizar-epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias necesarias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml urllib3

      - name: Ejecutar script Python
        run: python actualizar_epg.py

      # ------------------------------------------------------
      # 🔄 Sincronizar con el repositorio antes de guardar
      # ------------------------------------------------------
      - name: Sincronizar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git rebase origin/main

      # ------------------------------------------------------
      # 💾 Guardar EPG actualizado
      # ------------------------------------------------------
      - name: Guardar cambios en GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "EPG actualizada automáticamente"
          file_pattern: "epg_final.xml *.xml"
